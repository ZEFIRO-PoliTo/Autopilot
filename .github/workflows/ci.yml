name: ROS 2 Jazzy

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    env:
      ROS_DOMAIN_ID: 79
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-pytest python3-rosdep
          source /opt/ros/jazzy/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths zefiro_autonomy/src --ignore-src --rosdistro jazzy -y
      - name: Reject generated artifacts in Git
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(build|install|log|__pycache__)/|\.py[co]$'; then
            echo "Generated files must not be committed"
            exit 1
          fi
      - name: Build and test
        shell: bash
        run: bash scripts/check.sh
      - name: Launch smoke test
        shell: bash
        run: python3 scripts/smoke_demo.py
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros-test-logs
          path: |
            log/
            build/zefiro_demo/pytest.xml
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the documented development image
        run: docker compose build
      - name: Test the Compose workspace
        run: docker compose run --rm -T autonomy bash -c 'bash scripts/check.sh && python3 scripts/smoke_demo.py'
